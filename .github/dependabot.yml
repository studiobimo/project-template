version: 2
updates:
  # >>> template:base
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # The tools in mise.toml are not here: Dependabot does not read that file. They are
  # bumped by hand in studiobimo/project-template and arrive with `make -C .devtools sync`.
  # <<< template:base
