name: Issue title

# Holds every issue's title to Conventional Commits, from the same .commitlintrc.yaml as
# the commits and pull requests. A title that fails gets a label and one comment saying
# what to change; both go once it passes. The issue forms start each title with its type.

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

jobs:
  title:
    permissions:
      contents: read
      issues: write
    uses: studiobimo/.github/.github/workflows/ci-issue-title.yml@v1
