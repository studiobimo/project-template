name: Bug report
description: Something isn't working as expected.
title: 'fix: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please include enough detail to reproduce it.

        Title it like the fix that will close it: `fix(<scope>): <what is wrong>`, lowercase,
        for example `fix: the export drops the last row`.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: Paste any relevant output, or link a gist.
      render: text
