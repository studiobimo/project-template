name: Feature request
description: Something new, or a change to how something works.
title: 'feat: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Title it like the change that will close it: `feat(<scope>): <what it adds>`,
        lowercase, for example `feat: export to csv`.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, not the solution. The shape often changes once it is discussed.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
