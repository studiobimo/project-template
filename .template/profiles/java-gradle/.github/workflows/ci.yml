name: CI

# Two jobs. `ci` is the org's baseline and validate (`ci / baseline`, `ci / validate`): the
# hooks, the pull request's title, branch, size and commits, and `make -C .devtools ci`, which
# for this profile is the duplication check. `check` is the toolchain build, which `ci / validate`
# cannot run: it needs the JDK `.java-version` names, the Gradle setup and cache, and uploads
# the jars, none of which ci-project provides. `check` is the same Gradle target
# `make -C .devtools check` runs, so local and CI results match.
#
# Managed by studiobimo/project-template (profile java-gradle); it replaces the template's own
# ci.yml for a project that opts in.

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full suites, not the ones narrowed to what changed.
        type: boolean
        default: false

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
      # validate always requests packages: read, which it uses when a tracked .npmrc names
      # npm.pkg.github.com. A called job cannot hold more than its caller, so every caller grants
      # it up front. It is read-only.
      packages: read
    uses: studiobimo/.github/.github/workflows/ci-project.yml@v1
    with:
      full: ${{ inputs.full || false }}
      # spotlessCheck is part of the Gradle `check` below. Repeating it in baseline would need a
      # JDK 25 the baseline runner does not have (it runs on Java 17), so skip it there.
      exclude: spotless

  check:
    # A called workflow can never hold more than its caller, so the caller has to
    # grant what it needs. `permissions: {}` above keeps every other job at nothing.
    permissions:
      contents: read
    uses: studiobimo/.github/.github/workflows/ci-java-gradle.yml@v1
    with:
      gradle-tasks: check
      artifact-paths: |
        fabric/build/libs/*.jar
        neoforge/build/libs/*.jar
