name: CI

# Thin wrapper around the org's Java/Gradle toolchain workflow. `check` is the
# same target `make -C .devtools check` runs, so local and CI results match.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

jobs:
  check:
    # A called workflow can never hold more than its caller, so the caller has to
    # grant what it needs. `permissions: {}` above keeps every other job at nothing.
    permissions:
      contents: read
    uses: studiobimo/.github/.github/workflows/ci-java-gradle.yml@v1
    with:
      gradle-tasks: check
      artifact-paths: |
        fabric/build/libs/*.jar
        neoforge/build/libs/*.jar
