plugins {
    id 'java-library'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
}

def libs = versionCatalogs.named('libs')

def nullawayPackage = findProperty('nullaway_package')
if (!nullawayPackage) {
    throw new GradleException('Set nullaway_package in gradle.properties (the package NullAway checks).')
}
def externalSourcePath = (findProperty('external_source_path') ?: '').toString()

def javaVersion = rootProject.layout.projectDirectory.file('.java-version').asFile.text.trim() as int

base {
    archivesName = "${mod_id}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}

dependencies {
    compileOnly(libs.findLibrary('jspecify').get())
    errorprone(libs.findLibrary('errorprone-core').get())
    errorprone(libs.findLibrary('nullaway').get())
}

def modulesResolvedOnlyOnSomeHostOperatingSystems = [
        macOS      : 'ca.weblite:java-objc-bridge',
        linux      : 'io.netty:netty-transport-native-epoll',
        macOSAndBsd: 'io.netty:netty-transport-native-kqueue',
]

dependencyLocking {
    lockAllConfigurations()
    ignoredDependencies.addAll(modulesResolvedOnlyOnSomeHostOperatingSystems.values())
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
    options.compilerArgs.addAll(['-Xlint:all,-processing,-serial,-classfile', '-Werror'])
    options.errorprone {
        disableWarningsInGeneratedCode = true
        excludedPaths = externalSourcePath ? ".*/(build/generated|${externalSourcePath})/.*".toString() : '.*/build/generated/.*'
        option('NullAway:AnnotatedPackages', nullawayPackage.toString())
        option('NullAway:JSpecifyMode', 'true')
        error('NullAway')
    }
}

tasks.named('compileTestJava', JavaCompile) {
    options.errorprone.enabled = false
    options.compilerArgs.remove('-Werror')
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        if (externalSourcePath) {
            targetExclude("src/main/java/${externalSourcePath}/**".toString())
        }
        palantirJavaFormat(libs.findVersion('palantir-java-format').get().requiredVersion)
        removeUnusedImports()
        formatAnnotations()
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.version}+mc${minecraft_version}"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : project.version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'homepage'                     : homepage,
            'sources'                      : sources,
            'issues'                       : issues,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : javaVersion
    ]

    var jsonExpandProps = expandProps.collectEntries { key, value ->
        [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

tasks.register('resolveAndLockAll') {
    group = 'dependency locking'
    description = 'Resolves all configurations; run with --write-locks to refresh gradle.lockfile.'
    notCompatibleWithConfigurationCache('Resolves configurations at execution time')
    doFirst {
        assert gradle.startParameter.writeDependencyLocks: 'Run with --write-locks'
    }
    doLast {
        configurations.findAll { it.canBeResolved }.each { it.resolve() }
    }
}
