  # >>> template:gcp
  # The Dockerfile's base image, pinned by digest. The OpenTofu provider is bumped by hand,
  # like the tools in mise.toml: Dependabot's terraform updater reads Terraform's registry.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  # <<< template:gcp
