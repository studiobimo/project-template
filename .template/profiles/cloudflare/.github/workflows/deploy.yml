name: Deploy

# Deploys the Worker with `make -C .devtools deploy`, the target a developer runs:
#
#   push to main            -> staging
#   a release               -> production, from release.yml (below)
#   run it from Actions     -> either
#
# It reads a repository variable, CLOUDFLARE_ACCOUNT_ID, and a secret, CLOUDFLARE_API_TOKEN,
# kept in each GitHub environment rather than in the repository: a token from the "Edit
# Cloudflare Workers" template, limited to the account. Until the variable is set it skips.
# Each run is in a GitHub environment named after its target, so that environment's rules
# (reviewers, branches) gate it. Managed by studiobimo/project-template (profile cloudflare).
#
# release-please tags with GITHUB_TOKEN, which starts no other workflow, so production is
# deployed by a job in release.yml that calls this one. The token is the environment's own
# secret, so nothing is passed down:
#
#   deploy:
#     needs: release
#     if: needs.release.outputs.release-created == 'true'
#     permissions:
#       contents: read
#     uses: ./.github/workflows/deploy.yml
#     with:
#       environment: production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
  workflow_call:
    inputs:
      environment:
        description: staging or production
        type: string
        required: true

permissions: {}

jobs:
  deploy:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      contents: read
    # One deploy per environment at a time, each run to the end: a newer one queues.
    concurrency:
      group: deploy-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: what is deployed is built from the lockfiles alone.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          cache: false

      - name: make install
        run: make -C .devtools install

      - name: make deploy
        env:
          DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: make -C .devtools deploy ENV="${DEPLOY_ENV}"
