name: Deploy

# Deploys the Worker, or each app's Worker when APPS lists several, with
# `make -C .devtools deploy`, the target a developer runs:
#
#   push to develop         -> development
#   a release               -> production, from release.yml (below)
#   run it from Actions     -> either, from the branch that environment ships from
#
# The environments are the ones DEPLOY_ENVS lists in the project's Makefile, development and
# production unless it says otherwise. A project with only production sets
# `DEPLOY_ENVS := production`: a push to develop then deploys nothing, and a run from Actions
# with environment "auto", the default, deploys the first one listed.
#
# It reads a repository variable, CLOUDFLARE_ACCOUNT_ID, and a secret, CLOUDFLARE_API_TOKEN,
# kept in each GitHub environment rather than in the repository: a token from the "Edit
# Cloudflare Workers" template, limited to the account. Until the variable is set it skips.
# Each run is in a GitHub environment named after its target, so that environment's rules
# (reviewers, branches) gate it. The deploy target refuses a run from any other branch than
# the one its environment ships from: develop for development, main for production.
# Managed by studiobimo/project-template (profile cloudflare).
#
# release-please tags with GITHUB_TOKEN, which starts no other workflow, so production is
# deployed by a job in release.yml that calls this one. The token is the environment's own
# secret, so nothing is passed down:
#
#   deploy:
#     needs: release
#     if: needs.release.outputs.release-created == 'true'
#     permissions:
#       contents: read
#     uses: ./.github/workflows/deploy.yml
#     with:
#       environment: production

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [auto, development, production]
        default: auto
  workflow_call:
    inputs:
      environment:
        description: development or production, one of DEPLOY_ENVS
        type: string
        required: true

permissions: {}

jobs:
  # Names the environment before the deploy job starts, since a job's environment is fixed
  # before its steps run. Empty when there is nothing to deploy.
  plan:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pick the environment
        id: pick
        env:
          REQUESTED: ${{ inputs.environment }}
        run: |
          envs="$(make -C .devtools --no-print-directory -s deploy-envs)"
          case "${REQUESTED}" in
            auto) set -- ${envs}; pick="$1" ;;
            '') pick=development ;;
            *) pick="${REQUESTED}" ;;
          esac
          case " ${envs} " in
            *" ${pick} "*) echo "environment=${pick}" >>"${GITHUB_OUTPUT}"; exit 0 ;;
          esac
          if [ -n "${REQUESTED}" ]; then
            echo "::error::${pick} is not one of: ${envs}"
            exit 1
          fi
          echo "No ${pick} environment in: ${envs}"

  deploy:
    needs: plan
    if: needs.plan.outputs.environment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.plan.outputs.environment }}
    permissions:
      contents: read
    # One deploy per environment at a time, each run to the end: a newer one queues.
    concurrency:
      group: deploy-${{ needs.plan.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: what is deployed is built from the lockfiles alone.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          cache: false

      - name: make install
        run: make -C .devtools install

      - name: make deploy
        env:
          DEPLOY_ENV: ${{ needs.plan.outputs.environment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: make -C .devtools deploy ENV="${DEPLOY_ENV}"
