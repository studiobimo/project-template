  # >>> template:typescript
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1, so a TypeScript bump waits for it.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
    # target-branch is the project's own, so it goes on the line after this block's end
    # marker, where a sync leaves it: `target-branch: main`, or `develop` in a project
    # whose pull requests go to a develop branch.

  # The shared Dockerfile's Node, pinned by digest. A new tag fails make check until mise.toml's
  # node moves with it, in the same PR; a new major is a deliberate change.
  - package-ecosystem: docker
    directory: /.devtools/typescript
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  # <<< template:typescript
