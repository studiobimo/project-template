name: CI

# The root ci.yml, plus the caches this profile's tools fill. `ci / validate` installs the tools
# mise.toml pins and the packages pnpm-lock.yaml pins, then runs `make -C .devtools ci`: build,
# types, ESLint, knip, jscpd, tests, the audit and the Dockerfile's Node check. Turborepo
# narrows the tests to the packages a pull request changes. It is the target a developer runs,
# at the same versions, so local and CI results match. Managed by studiobimo/project-template
# (profile typescript); it replaces the template's own ci.yml for a project that opts in.
#
# Nothing here reads a secret, so it is safe on pull requests from forks. Deploying is a
# hosting profile's job, in its own workflow.
#
# The caches are restored on every run and saved only by a push to main or develop.

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full suites, not the ones narrowed to what changed.
        type: boolean
        default: false

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
      # validate always requests packages: read, which it uses when a tracked .npmrc names
      # npm.pkg.github.com. A called job cannot hold more than its caller, so every caller grants
      # it up front. It is read-only.
      packages: read
    uses: studiobimo/.github/.github/workflows/ci-project.yml@v1
    with:
      full: ${{ inputs.full || false }}
      timeout-minutes: 20
      cache-path: |
        node_modules/.cache
        .turbo
        ~/.local/share/pnpm/store
      cache-key-files: |
        pnpm-lock.yaml
        mise.lock
