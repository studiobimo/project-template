name: CI

# The root ci.yml, plus the caches this profile's tools fill. `ci / validate` installs the tools
# mise.toml pins and the packages pnpm-lock.yaml pins, then runs `make -C .devtools ci`: build,
# route tree, types, ESLint, knip, jscpd, Prettier, tests, bundle budget and the audit, with
# the browser suites only in a full run. It is the target a developer runs, at the same
# versions, so local and CI results match. Managed by studiobimo/project-template (profile
# vite-react-tanstack); it replaces the template's own ci.yml for a project that opts in.
#
# Nothing here reads a secret, so it is safe on pull requests from forks. Deploying is a
# hosting profile's job, in its own workflow.
#
# The caches are restored on every run and saved only by a push to main or develop. In a pnpm
# workspace the app's own node_modules/.cache and node_modules/.tmp are not at the root: list
# them too, in a project that has APP_DIR.

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full suites, not the ones narrowed to what changed.
        type: boolean
        default: false

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: studiobimo/.github/.github/workflows/ci-project.yml@v1
    with:
      full: ${{ inputs.full || false }}
      timeout-minutes: 20
      cache-path: |
        node_modules/.cache
        node_modules/.tmp
        ~/.local/share/pnpm/store
        ~/.cache/ms-playwright
      cache-key-files: |
        pnpm-lock.yaml
        mise.lock
