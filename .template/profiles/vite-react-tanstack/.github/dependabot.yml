  # >>> template:vite
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1, so a TypeScript bump waits for it.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
  # <<< template:vite
